[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tainitec-data-tools"
version = "0.1.0"
description = "Tools for working with TAINILIVE recordings (.dat, .sync, configuration.yaml) and converting to EDF+."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TainiTec Ltd." }]
dependencies = [
    "numpy>=1.20",
    "pyEDFlib>=0.1.30",
    "PyYAML>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dat2edf = "tainitec_data_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
